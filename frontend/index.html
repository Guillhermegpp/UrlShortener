<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>URL Shortener</title>
</head>

<body>
    <main class="container">
        <header>
            <h1>URL Shortener</h1>
            <p>ENCURTADOR DE LINKS</p>
        </header>

        <form id="form-url">
            <label for="url">Cole sua URL abaixo</label>
            <input type="text" id="url" name="url" placeholder="https://www.exemplo.com.br" required>
            <button type="submit" id="botao-encurtar">
                Encurtar URL
            </button>
        </form>
        <div id="mensagem"></div>
        <section id="lista-links">
            <h2>Meus links</h2>
                <div id="links-container"></div>
            </section>
        
    </main>
</body>

</html>
